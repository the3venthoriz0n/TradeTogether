name: Release

# Pushing a tag like v0.2.2 (the tagged commit must be on main, or the run stops) is all a release needs: the tag IS the version.
# The run stamps it into CMakeLists.txt, vcpkg.json, src/main.cpp, tools/make_vortex_archive.ps1, make_vortex_archive.bat,
# build_release.bat and package/Data/SKSE/Plugins/TradeTogether.ini (the internal build marker is <version>-strpm, which the
# DLL check in tools/verify_release_dll.ps1 requires), builds the plugin on Windows, packages dist/TradeTogether_<version>.zip
# with tools/make_vortex_archive.ps1 and creates a GitHub release with it.
#
# A test tag such as v0.2.2-test1 builds the same zip and makes a GitHub PRE-RELEASE with it, so every change can get a kept
# build without publishing it.
#
# There is no Nexus Mods step and no version bump commit: this repo has no Nexus page, so the stamped version numbers live
# only in the tagged build (the numbers in the repo are not edited by the workflow).
#
# Run manually from the Actions tab to build and package without releasing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # vcpkg builds its dependencies from source; keep the built packages between runs. The cache is
      # keyed on the manifest, so a dependency change rebuilds only what changed.
      - name: Prepare the vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Tag must be on main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME is not on main; nothing was published." }

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $suffix = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)(?:-([0-9A-Za-z.]+))?$') {
              throw "Tag $env:GITHUB_REF_NAME must look like v1.2.3 (release) or v1.2.3-test1 (test build)"
            }
            $v = $Matches[1]
            if ($Matches[2]) { $suffix = $Matches[2] }
          } else {
            $m = Select-String -Path CMakeLists.txt -Pattern 'project\(TradeTogether VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
            if (-not $m) { throw "Could not read the version from CMakeLists.txt" }
            $v = $m.Matches[0].Groups[1].Value
          }
          $full = if ($suffix) { "$v-$suffix" } else { $v }
          "version=$v" >> $env:GITHUB_OUTPUT
          "full=$full" >> $env:GITHUB_OUTPUT
          "test=$(if ($suffix) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Stamp the version into the sources
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          function Stamp([string]$path, [string]$pattern, [string]$replacement) {
            $text = [System.IO.File]::ReadAllText((Join-Path $PWD $path))
            $rx = [regex]$pattern
            if ($rx.Matches($text).Count -ne 1) { throw "Expected exactly one version match in $path" }
            [System.IO.File]::WriteAllText((Join-Path $PWD $path), $rx.Replace($text, $replacement))
            Write-Host "Stamped $path -> $v"
          }
          $num = '[0-9]+\.[0-9]+\.[0-9]+'
          Stamp 'CMakeLists.txt' "(project\(TradeTogether VERSION )$num" ('${1}' + $v)
          Stamp 'vcpkg.json' "(`"version-string`":\s*`")$num(`")" ('${1}' + $v + '${2}')
          Stamp 'src/main.cpp' "(`"TradeTogether v)$num(-strpm ready )" ('${1}' + $v + '${2}')
          Stamp 'src/main.cpp' "(`"TradeTogether v)$num(-strpm loading`")" ('${1}' + $v + '${2}')
          Stamp 'tools/make_vortex_archive.ps1' "(\[string\]\`$Version = `")$num(-strpm`")" ('${1}' + $v + '${2}')
          Stamp 'make_vortex_archive.bat' "(-Version `")$num(-strpm`")" ('${1}' + $v + '${2}')
          Stamp 'build_release.bat' "(set `"TRADETOGETHER_VERSION=)$num(-strpm`")" ('${1}' + $v + '${2}')
          Stamp 'build_release.bat' "(set `"TRADETOGETHER_PUBLIC_VERSION=)$num(`")" ('${1}' + $v + '${2}')
          Stamp 'package/Data/SKSE/Plugins/TradeTogether.ini' "(# TradeTogether v)$num(-strpm uses)" ('${1}' + $v + '${2}')

      - name: Configure
        shell: pwsh
        run: cmake -S . -B out\build-release -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build out\build-release --config Release

      # This repo has no automated tests; the build and the packaging script's DLL version check (tools/verify_release_dll.ps1,
      # which looks for "TradeTogether v<version>-strpm loading" in the DLL) are the gate.

      - name: Package
        id: package
        shell: pwsh
        run: |
          powershell -File tools\make_vortex_archive.ps1 -Version "${{ steps.ver.outputs.version }}-strpm"
          if ($LASTEXITCODE -ne 0) { throw "make_vortex_archive.ps1 failed" }
          # The script strips -strpm and writes dist\TradeTogether-<version>.zip; the release name uses an underscore and keeps a test tag's full name.
          Copy-Item "dist\TradeTogether-${{ steps.ver.outputs.version }}.zip" "dist\TradeTogether_${{ steps.ver.outputs.full }}.zip"

      # The GPL source archive: the repository at the tagged commit plus the pinned submodule sources. The script stops
      # if a submodule is not checked out (the checkout above uses submodules: recursive). -OverlayWorkingTree adds the
      # stamped version numbers, which are not committed at this point. It is attached to the GitHub release only;
      # the Nexus upload below sends the mod zip alone.
      - name: Source archive
        id: source
        shell: pwsh
        run: |
          git submodule status --recursive
          powershell -File tools\make_source_archive.ps1 -Version ${{ steps.ver.outputs.full }} -OverlayWorkingTree
          if ($LASTEXITCODE -ne 0) { throw "make_source_archive.ps1 failed" }
          if (-not (Test-Path "dist\TradeTogether_${{ steps.ver.outputs.full }}_source.zip")) { throw "Source archive was not written under the expected name" }

      - uses: actions/upload-artifact@v4
        with:
          name: TradeTogether_${{ steps.ver.outputs.full }}
          path: |
            dist/TradeTogether_${{ steps.ver.outputs.full }}.zip
            dist/TradeTogether_${{ steps.ver.outputs.full }}_source.zip

      - name: GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @()
          if ('${{ steps.ver.outputs.test }}' -eq 'true') { $extra += '--prerelease' }
          gh release create "$env:GITHUB_REF_NAME" "dist\TradeTogether_${{ steps.ver.outputs.full }}_source.zip" "dist\TradeTogether_${{ steps.ver.outputs.full }}.zip" --generate-notes --title "TradeTogether_${{ steps.ver.outputs.full }}" @extra
